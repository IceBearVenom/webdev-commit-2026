
name: Deploy GitHub Pages

on:
  push:
    branches:
      - Commit 2026
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend branch
        uses: actions/checkout@v6
        with:
          ref: frontend

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./ 

      - name: Deploy
        uses: actions/deploy-pages@v4
